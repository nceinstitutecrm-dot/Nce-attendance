 const result={format:'NCE_EXCEL_ARCHIVE_V2',project:manifest.Project,exportedAt:String(manifest.CreatedAt||''),students:{}};
 for(const name of ['students',...archiveCollections]){
  if(!wb.Sheets[name])throw Error('Missing backup sheet: '+name);
  for(const row of XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''})){
   if(!row.StudentID&&!row.RecordID&&!row.RecordJSON)continue;
   const sid=String(row.StudentID),id=String(row.RecordID);if(!sid||!id||!row.RecordJSON)throw Error('Incomplete record in '+name);

   if(student.collections[name].some(x=>x.id===id))throw Error('Duplicate record in '+name+': '+id);
   student.collections[name].push({id,data:JSON.parse(String(row.RecordJSON))});

 if(state?.nceApp===NCE_HISTORY_TAG&&Number.isInteger(state.index)){
  nceHistoryIndex=state.index;
  if(navItems().some(x=>x.id===state.page))page=state.page;
 }else nceHistoryIndex=0;

}
function ncePushHistory(kind,p=page){

}
function nceFinishOverlay(kind){
 if(nceHistoryReady&&history.state?.nceApp===NCE_HISTORY_TAG&&history.state.kind===kind)

}

window.addEventListener('popstate',e=>{

 // First Back press dismisses the visible overlay, without leaving its page.

function normalizeBatch(v){const raw=String(v||'').trim();if(!raw)return '';const m=raw.match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?\s*(?:to|[-–—])\s*(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?$/i);if(!m)return raw;const a=Number(m[1]),b=Number(m[4]);if(a<1||a>12||b<1||b>12)return raw;const min1=m[2]&&Number(m[2])?':'+m[2]:'';const min2=m[5]&&Number(m[5])?':'+m[5]:'';return `${a}${min1} to ${b}${min2}`}
function batchOrderKey(v){
 const m=normalizeBatch(v).match(/^(\d{1,2})(?::(\d{2}))?\s+to\s+(\d{1,2})(?::(\d{2}))?$/i);
 if(!m)return [9999,9999,String(v).toLowerCase()];
 const clock=(h,min)=>{h=Number(h);return (h<8?h+12:h)*60+Number(min||0)};
 return [clock(m[1],m[2]),clock(m[3],m[4]),String(v).toLowerCase()];
}
function sortBatches(items){return [...new Set(items.map(normalizeBatch).filter(Boolean))].sort((a,b)=>{const x=batchOrderKey(a),y=batchOrderKey(b);return x[0]-y[0]||x[1]-y[1]||x[2].localeCompare(y[2])})}

// Always resolve display names from current staffProfiles, not stale assignment snapshots.
// Display-only lookup. Caller accounts cannot read all staffProfiles because those
// private profiles also contain salary and account metadata. Reuse the safe staff
// name snapshots already stored on student assignment documents instead.
function readableStaffName(raw,uid){
 const v=String(raw||'').trim();
 // Never show a Firebase Auth UID in any staff-facing list.
 if(!v||v===uid||/^[A-Za-z0-9_-]{20,}$/.test(v))return '';
 return v;
}
function currentStaffName(uid, savedName){
 const id=String(uid||'').trim();
 if(!id)return readableStaffName(savedName,'')||'Unassigned';
 const record=staff.find(x=>x.id===id);
 const name=readableStaffName(record?.name,id);
 if(name)return name;
 // This fallback works for Caller, Staff and Attendance Manager logins without
 // granting access to confidential staffProfiles / payroll records.
 for(const s of students){
  if(s.staffUid===id){const n=readableStaffName(s.staffName,id);if(n)return n;}
  for(const a of (Array.isArray(s.batchAssignments)?s.batchAssignments:[])){
   if(a?.staffUid===id){const n=readableStaffName(a.staffName,id);if(n)return n;}
  }
 }
 return readableStaffName(savedName,id)||'Staff name unavailable';
}
function attendanceStaffName(a){

 const assignmentIds=[{id:'primary',batch:s?.batch,staffUid:s?.staffUid,staffName:s?.staffName},...(Array.isArray(s?.batchAssignments)?s.batchAssignments:[])];
 const matched=assignmentIds.find(x=>a.assignmentId&&x.id===a.assignmentId)
   ||assignmentIds.find(x=>a.assignedStaffUid&&x.staffUid===a.assignedStaffUid&&normalizeBatch(x.batch)===a.studentBatch)
   ||assignmentIds.find(x=>normalizeBatch(x.batch)===a.studentBatch);

function studentAssignments(s){
 const a=Array.isArray(s.batchAssignments)?s.batchAssignments:[];
 const primary={id:'primary',batch:normalizeBatch(s.batch),staffUid:s.staffUid||'',staffName:s.staffName||'',course:s.course||''};
 const all=[primary,...a.filter(x=>x&&x.id&&x.id!=='primary'&&x.batch).map(x=>({...x,batch:normalizeBatch(x.batch)}))].filter(x=>(s.assignmentStatus||{})[x.id]!=='stopped'&&(s.assignmentStatus||{})[x.id]!=='transferred').map(x=>({...x,staffName:currentStaffName(x.staffUid,x.staffName)}));

 const seen=new Set();return all.filter(x=>{const key=assignmentSignature(x);if(seen.has(key))return false;seen.add(key);return true});

function studentIdentityKey(s){
 const roll=String(s.rollNumber||'').trim().toLowerCase();

function nceSuggestStaffUid(part){
 const matching=staff.filter(x=>x.role==='staff'&&x.active!==false&&new RegExp('(^|[^a-z])'+part+'([^a-z]|$)','i').test(String(x.name||'')));
 return matching.length===1?matching[0].id:''; // Ambiguous / missing name: require explicit Admin selection.
}
function nceBatchCandidates(){return sortBatches([...allBatches(),'10 to 12','2 to 4']);}
function nceValidBatch(raw){
 const b=normalizeBatch(raw);
 if(!/^\d{1,2}(?::[0-5]\d)? to \d{1,2}(?::[0-5]\d)?$/i.test(b))return false;
 return b.length<=80;
}
function nceBatchDraft(list){
 const entries=[];
 for(const row of list){
  if(!row.checked)continue;
  const emp=staff.find(t=>t.id===row.staffUid&&t.role==='staff'&&t.active!==false);
  if(!emp)return {error:'Choose an active Teaching Staff for every selected batch.'};
  const batch=normalizeBatch(row.batch),course=row.course.trim();
  if(!nceValidBatch(batch))return {error:'Enter a valid Batch Time, for example 10 to 12 or 2 to 4.'};
  if(!course||course.length>120)return {error:'Course name is required (maximum 120 characters).'};
  entries.push({id:row.id,staffUid:emp.id,staffName:emp.name,batch,course});
 }
 if(!entries.length)return {error:'Select at least one New Batch.'};
 const signatures=entries.map(assignmentSignature);
 if(new Set(signatures).size!==signatures.length)return {error:'The same Staff / Batch / Course was selected more than once.'};
 return {entries};
}

 <div class="nce-mb-existing"><b>✓ Keep Existing Batches (${saved.length})</b><p class="muted" style="margin:4px 0 8px">These active batches will stay unchanged.</p>${saved.map(a=>`<div class="nce-mb-existing-row"><b>${esc(currentStaffName(a.staffUid,a.staffName))}</b> · ${esc(a.batch)} · ${esc(a.course||'—')}</div>`).join('')}</div>

 const rows=$('mbRows'),preview=$('mbPreview'),saveBtn=$('mbSave');

 function refresh(){

  const newOnes=draft.entries.map(a=>({...a,id:newAssignmentId()}));
  try{

    const live={id:s.id,...snap.data()};
    const liveSnapshot=JSON.stringify({batch:live.batch,staffUid:live.staffUid,course:live.course,batchAssignments:live.batchAssignments||[],assignmentStatus:live.assignmentStatus||{},courseStatus:live.courseStatus||'',active:live.active,admissionStatus:live.admissionStatus||''});

    trx.update(studentRef,{batchAssignments:[...oldExtras,...newOnes],courses:updatedCourses,updatedAt:serverTimestamp()});
    for(const a of newOnes){
     trx.set(doc(db,'studentAssignments',s.id+'_'+a.id),{studentId:s.id,assignmentId:a.id,batch:a.batch,staffUid:a.staffUid,staffName:a.staffName,course:a.course,updatedAt:serverTimestamp()});

    }
   });
   closeModal();await load();studentsView();alert(newOnes.length+' new batches added. Existing batches and old history preserved.');
  }catch(err){alertError(err)}finally{working=false;const b=$('mbSave');if(b)refresh()}
 };
 draw();
}

function nceSameBatchValid(s,assignmentId,target){

 if(!old)return {error:'The selected batch is no longer active. Refresh Student Profile.'};

   fromUid:old.staffUid,fromName:currentStaffName(old.staffUid,old.staffName),

// NCE Absent Calling: speech-to-text draft note. NEVER saves or uploads audio via Firebase.
let nceVoiceSession=null;
function nceDisposeVoiceTyping(){

 if(!session)return;
 nceVoiceSession=null;

 r.onstart=null;r.onresult=null;r.onerror=null;r.onend=null;
 try{r.abort()}catch(_ignored){}
}
function nceBindAbsentVoiceTyping(){
 const note=$('nceCallNote'),start=$('nceVoiceStart'),stop=$('nceVoiceStop'),micTest=$('nceVoiceMicTest'),lang=$('nceVoiceLang'),status=$('nceVoiceStatus'),form=$('callForm');
 if(!note||!start||!stop||!lang||!status||!form)return;
 const SpeechAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
 const saveBtns=[...form.querySelectorAll('#saveNextCall, button[type="submit"]')];
 const inform=(message,error=false)=>{status.textContent=message;status.classList.toggle('is-error',error)};
 const buttons=(listening,finishing=false)=>{
  start.disabled=listening||finishing;
  stop.disabled=!listening||finishing;
  lang.disabled=listening||finishing;
  if(micTest)micTest.disabled=listening||finishing;

  if(nceVoiceSession)return;
  if(!navigator.mediaDevices?.getUserMedia){inform('Microphone test is unavailable in this browser. Open the HTTPS Netlify link in current Chrome.',true);return}
  micTest.disabled=true;
  inform('Testing browser microphone access…');

   stream=await navigator.mediaDevices.getUserMedia({audio:true});
   const track=stream.getAudioTracks()[0];
   if(!track)throw new Error('No microphone audio track returned');
   inform('✅ Microphone access works in Chrome ('+(track.label||'input device')+'). If Voice Typing still reports not-allowed, Chrome speech recognition is being blocked separately. Try English (India) and restart Chrome.');
  }catch(err){
   const code=String(err?.name||'UnknownError');
   const guide=(code==='NotAllowedError'||code==='PermissionDeniedError')?'Browser or Windows blocked microphone access. Enable Windows microphone access and Allow desktop apps to access your microphone.':(code==='NotFoundError'||code==='DevicesNotFoundError')?'No working microphone was detected. Connect or select a microphone in Windows Sound settings.':code==='NotReadableError'?'Microphone is in use or unavailable. Close other recording apps, then try again.':'Microphone test failed. Check Windows input device and Chrome microphone settings.';

   }

  };

   if(nceVoiceSession!==session)return;
   nceVoiceSession=null;
   buttons(false);
   if(session.error)inform(session.error,session.error!=='Voice typing stopped.');
   else inform('Voice typing finished. Review or edit the Call Note, then tap Save Response.');
  };
  try{buttons(true);inform('Requesting microphone access…');recognition.start()}
  catch(err){nceVoiceSession=null;buttons(false);inform('Could not start voice typing. Check microphone permissions or type the note.',true)}

  if(!session||session.finishing)return;

// Admin-only repair of secondary student-to-staff assignment mirrors.
// The source of truth is students/{id}.batchAssignments; never modifies student profiles, attendance, leave, fees or call history.
async function repairStaffBatchLinks(){
 if(!isAdmin())return alert('Admin access required.');
 const button=$('repairBatchLinks');if(button)button.disabled=true;
 try{
  const snap=await getDocs(collection(db,'studentAssignments'));
  const existing=new Map(snap.docs.map(d=>[d.id,d.data()]));
  const updates=[];const issues=[];
  const validStaff=new Set(staff.filter(x=>x.role==='staff'&&x.active!==false).map(x=>x.id));
  for(const student of students){
   const extras=Array.isArray(student.batchAssignments)?student.batchAssignments:[];
   const stopped=student.assignmentStatus||{};
   for(const a of extras){
    if(!a||!a.id||a.id==='primary'||stopped[a.id]==='stopped'||stopped[a.id]==='transferred')continue;
    if(!a.staffUid||!a.batch||!validStaff.has(a.staffUid)){
     issues.push(`${student.name||student.id} · ${a.batch||'No batch'}: staff account missing/inactive`);continue;
    }
    if(String(a.id).includes('/')){issues.push(`${student.name||student.id}: invalid assignment ID`);continue;}
    const id=student.id+'_'+a.id;
    const old=existing.get(id);
    const norm=normalizeBatch(a.batch);
    const course=String(a.course||'');
    if(old&&old.studentId===student.id&&old.assignmentId===a.id&&old.staffUid===a.staffUid&&normalizeBatch(old.batch)===norm&&String(old.course||'')===course)continue;
    updates.push({id,student,a,batch:norm});
   }
  }
  if(!updates.length){alert('Batch links checked. No missing or mismatched active links. '+(issues.length?'Needs manual review: '+issues.length+'. '+issues.slice(0,4).join(' | '):'All active secondary links verified.'));return;}
  if(!confirm(`Found ${updates.length} missing/mismatched Staff-Batch links. Repair only these access records? Student profiles, Attendance, Fees, Leave and Calling History will NOT be changed.${issues.length?' '+issues.length+' require manual review.':''}`))return;
  // Conservative batch size: stay safely under Firestore's 500-operation limit.
  let fixed=0;
  for(let i=0;i<updates.length;i+=250){
   const b=writeBatch(db);
   for(const x of updates.slice(i,i+250)){
    b.set(doc(db,'studentAssignments',x.id),{studentId:x.student.id,assignmentId:x.a.id,batch:x.batch,staffUid:x.a.staffUid,staffName:currentStaffName(x.a.staffUid,x.a.staffName),course:x.a.course||'',updatedAt:serverTimestamp()});
   }
   await b.commit();fixed+=Math.min(250,updates.length-i);
  }
  alert(`Repaired ${fixed} Staff-Batch links. Staff can sign out and sign in again, then retry Save Attendance.${issues.length?' '+issues.length+' entries need Admin manual review: '+issues.slice(0,6).join(' | '):''}`);
 }catch(err){alertError(err)}finally{if(button)button.disabled=false;}
}
// Diagnose failed staff writes without changing permissions or editing any student data.
// An absent secondary mirror is one possible cause; the currently deployed rules
// must still be checked by the Admin if this diagnostic finds no broken link.
async function nceAttendancePermissionDiagnosis(failedRows){
 const details=[];
 if(role==='staff'){
  try{
   const mine=await getDoc(doc(db,'staffProfiles',user.uid));
   if(!mine.exists()||mine.data().active!==true||mine.data().role!=='staff'){
    details.push('Your Staff account is not Active with role Staff. Ask Admin to check Staff Management.');
   }
  }catch(e){details.push('Could not verify Staff role. Check your login and the published Firestore Rules.');}
  const secondary=failedRows.filter(x=>x.assignment.id!=='primary').slice(0,12);
  const broken=[];
  for(const {student:s,assignment:a} of secondary){
   try{
    const ref=doc(db,'studentAssignments',s.id+'_'+a.id);
    const result=await getDoc(ref);
    const m=result.exists()?result.data():null;
    if(!m||m.studentId!==s.id||m.assignmentId!==a.id||m.staffUid!==a.staffUid||normalizeBatch(m.batch)!==normalizeBatch(a.batch))broken.push(s.name+' ('+a.batch+')');
   }catch(e){broken.push(s.name+' ('+a.batch+'; link missing or unreadable)');}
  }
  if(broken.length){
   details.push('Staff-Batch links need checking for: '+broken.slice(0,6).join(', ')+'.');
   details.push('Admin: Student Attendance → Repair Staff-Batch Links. Review the proposed changes before confirming.');
  }
 }
 if(!details.length){
  details.push('Confirm that the deployed Firestore Rules match the supplied firestore.rules file, that the assigned Staff UID is correct, and that older attendance belongs to the same staff/batch.');
  details.push('Admin can also use Student Attendance → Repair Staff-Batch Links if these are secondary teaching sessions.');
 }
 return details.join(' ');
}

// A rule evaluation can read only 20 other documents across an entire Firestore
// writeBatch (and 10 per individual operation). Secondary sessions check a
// different studentAssignments document each time. Keep each atomic group small.
const NCE_ATTENDANCE_BATCH_SIZE=6;
let nceAttendanceSaving=false;
async function saveAttendance(){
 if(nceAttendanceSaving)return;

 const ids=Object.keys(marks);
 if(!ids.length)return alert('Mark at least one student.');

 const indexed=new Map(entries.map(x=>[attendanceDocId(date,x.student.id,x.assignment.id),x]));
 const selected=ids.map(key=>({key,item:indexed.get(key)})).filter(x=>x.item&&x.item.assignment.batch===batch&&
  (attendanceStaffFilter==='all'||x.item.assignment.staffUid===attendanceStaffFilter)&&
  assignmentCanMark(x.item.student,x.item.assignment));
 if(!selected.length)return alert('No matching assignments to save.');
 if(selected.length>450)return alert('Select fewer than 450 sessions per save.');
 const conflicts=selected.filter(({key,item})=>{
  const previous=attendance.find(a=>a.id===key);
  return previous&&(previous.assignedStaffUid!==item.assignment.staffUid||
   normalizeBatch(previous.studentBatch)!==normalizeBatch(item.assignment.batch)||
   String(previous.assignmentId||'primary')!==item.assignment.id);
 });
 if(conflicts.length)return alert('Previously saved attendance belongs to a different Staff / Batch / Assignment for: '+
  conflicts.slice(0,6).map(x=>x.item.student.name).join(', ')+'. Ask Admin to review these old records. No changes saved.');
 // Validate the entire selection BEFORE starting any writes.
 const prepared=[];
 for(const {key,item} of selected){
  const {student:s,assignment:a}=item;
  if(holidayForAssignment(date,a))return alert('Batch Holiday H applies to '+s.name+' · '+a.batch+'. Revoke Holiday before saving. No changes saved.');
  const old=attendance.find(x=>x.id===key);
  if(old?.leavePlanId)return alert('This attendance is part of a Multi-Day Leave Plan. Edit or cancel the plan first: '+s.name+'. No changes saved.');
  const status=marks[key],reason=leaveReasons[key]||old?.leaveReason||'';
  if(!['P','A','L'].includes(status))return alert('Invalid attendance status for '+s.name+'. No changes saved.');
  if(status==='L'&&!reason)return alert('Leave reason required: '+s.name+'. No changes saved.');
  prepared.push({key,item,data:{studentId:s.id,studentName:s.name,studentBatch:a.batch,
   assignedStaffUid:a.staffUid,date,status,markedBy:user.uid,updatedAt:serverTimestamp(),actualBatch:a.batch,
   ...(a.id==='primary'?{}:{assignmentId:a.id}),...(status==='L'?{leaveReason:reason}:{})}});
 }
 const saveButton=$('saveAtt');
 nceAttendanceSaving=true;
 if(saveButton){saveButton.disabled=true;saveButton.textContent='Saving…';}
 const saved=[],denied=[],uncertain=[];
 const commitRows=async rows=>{
  const b=writeBatch(db);
  for(const x of rows)b.set(doc(db,'attendance',x.key),x.data);
  await b.commit();
 };
 try{
  for(let i=0;i<prepared.length;i+=NCE_ATTENDANCE_BATCH_SIZE){
   const group=prepared.slice(i,i+NCE_ATTENDANCE_BATCH_SIZE);
   try{
    await commitRows(group);saved.push(...group);
   }catch(err){
    console.error('Attendance group failed',err);
    if(err?.code==='permission-denied'){
     // Only a definite permission denial is safe to retry individually.
     // Single writes also identify exactly which student needs Admin attention.
     for(const x of group){
      try{await commitRows([x]);saved.push(x)}
      catch(e){console.error('Attendance row failed',x.key,e);
       if(e?.code==='permission-denied')denied.push(x);
       else uncertain.push(x);

     }
    }else{
     // For a network/timeout error the commit result can be unknown: do NOT retry.
     uncertain.push(...group);
    }
   }
  }
  // Only clear marks for rows whose commits were confirmed successful.
  for(const x of saved){delete marks[x.key];delete leaveReasons[x.key];}
  if(saved.length){
   try{await load();render()}
   catch(e){console.error('Saved attendance; refresh failed',e);
    alert('Attendance was saved, but refreshing the screen failed. Reload the page and check the records before trying again.');}
  }
  if(denied.length||uncertain.length){
   const names=denied.slice(0,8).map(x=>x.item.student.name+' ('+x.item.assignment.batch+')').join(', ');
   let message='Attendance save result: '+saved.length+' saved, '+denied.length+' permission denied, '+uncertain.length+' not confirmed.';
   if(names)message+='\nBlocked students: '+names+'.';
   if(uncertain.length)message+='\nSome writes may have completed during a connection problem. Refresh and verify attendance BEFORE trying again.';

   alert(message);
  }else alert('Saved '+saved.length+' attendance sessions successfully.');
 }finally{
  nceAttendanceSaving=false;
  const button=$('saveAtt');if(button){button.disabled=false;button.textContent='Save Attendance';}
 }
}

function backupCleanCell(value){
 if(value===null||value===undefined)return '';
 if(typeof value==='number'&&Number.isFinite(value))return value;
 const s=String(value);
 // Treat all user-supplied text as strings; neutralize spreadsheet formula-like input.
 return /^[\s]*[=+@\-]/.test(s)?"'"+s:s;
}
function backupStamp(value){
 if(!value)return '';
 try{if(typeof value.toDate==='function')return value.toDate().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour12:false});}
 catch(e){}
 if(value.seconds!==undefined){const d=new Date(Number(value.seconds)*1000);return Number.isNaN(d.getTime())?'':d.toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour12:false})}
 return String(value);
}
function backupPlain(value){
 if(value==null)return value;
 if(typeof value.toDate==='function')return value.toDate().toISOString();
 if(Array.isArray(value))return value.map(backupPlain);
 if(typeof value==='object')return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,backupPlain(v)]));
 return value;
}

function backupRecordKey(name,r){
 const v=i=>String(r[i]??'').trim();
 if(name==='Absent Call History')return v(8)?'call:'+v(8):'call-fallback:'+JSON.stringify(r);
 if(name==='Student Leave')return v(10)?'leave-id:'+v(10):'leave:'+v(0)+'|'+v(8)+'|'+v(9);
 // Never merge solely by roll number, name or phone.
 return v(7)?'attendance-id:'+v(7):'attendance:'+v(0)+'|'+v(5)+'|'+(v(6)||v(2)+'|'+v(3));
}
function backupRecoveryReport(base,result,period){
 if(!base?.recovered)return null;
 let exact=0,unmatched=0,outside=0,ambiguous=0;
 for(const [name,headers,newRows] of result.sheets){
  const n=headers.length,old=base.old.get(name)||[];
  const signature=r=>JSON.stringify(r.slice(0,n).map(backupCleanCell));
  const count=(rows)=>{const map=new Map();for(const r of rows){const k=signature(r);map.set(k,(map.get(k)||0)+1);}return map;};
  const current=count(newRows),previous=count(old);
  for(const r of old){
   if(String(r[0])<period.start||String(r[0])>period.end){outside++;continue;}
   const key=signature(r),matches=current.get(key)||0;
   if(matches===1&&previous.get(key)===1)exact++;
   else if(matches>1||previous.get(key)>1)ambiguous++;
   else unmatched++;
  }
 }
 return {exact,unmatched,outside,ambiguous};
}
function backupMergeWorkbook({baseData,period,result,nowStamp,filename}){
 const wb=XLSX.utils.book_new(),old=baseData?.old||new Map(),full=new Map();
 let replaced=0,added=0,retained=0;
 for(const [name,headers,newRows] of result.sheets){
  const rows=[],positions=new Map();
  const newVisibleCount=headers.length;
  const fullVisible=entry=>JSON.stringify(entry.slice(0,newVisibleCount).map(backupCleanCell));
  const available=new Map();
  if(baseData?.recovered)for(const r of newRows){const k=fullVisible(r);available.set(k,[...(available.get(k)||[]),r]);}
  let safeRecovered=0;
  for(const entry of old.get(name)||[]){
   let existing=entry;
   if(baseData?.recovered){
    const candidates=available.get(fullVisible(entry))||[];
    if(candidates.length===1){existing=candidates[0];safeRecovered++;available.delete(fullVisible(entry));}
   }
   const k=backupRecordKey(name,existing);
   if(positions.has(k))rows[positions.get(k)]=[...existing];else{positions.set(k,rows.length);rows.push([...existing]);}
  }
  for(const r of newRows){const k=backupRecordKey(name,r);if(positions.has(k)){rows[positions.get(k)]=r;replaced++;}
   else{positions.set(k,rows.length);rows.push(r);added++;}}
  retained+=(old.get(name)||[]).length;
  rows.sort((a,b)=>String(a[0]).localeCompare(String(b[0]))||String(a[1]).localeCompare(String(b[1])));
  if(rows.length+1>1048576)throw Error('Excel row limit reached for '+name+'. Use a new workbook.');
  full.set(name,rows);backupSheet(wb,name,headers,rows);
 }
 backupWorkbookProperties(wb,firebaseConfig.projectId,full);
 const dates=new Set(full.get('Student Attendance').map(r=>r[0]));
 const totals={days:dates.size,recordCount:full.get('Student Attendance').length,
  leaveCount:full.get('Student Leave').length,callCount:full.get('Absent Call History').length};
 return {wb,totals,replaced,added,retained,filename};
}

 async function processBackup(kind,file=null,handle=null){
  const status=$('backupStatus'),buttons=[$('backupCreate'),$('backupUpdateDownload'),$('backupUpdateInPlace')];
  const inputs=[...document.querySelectorAll('[data-backup-mode],#backupDayInput,#backupMonthInput,#backupYearInput,#backupThisPeriod,#backupRefresh,#backupMasterFileName,#backupExistingFile')];
  buttons.forEach(b=>b.disabled=true);inputs.forEach(b=>b.disabled=true);
  try{
   const p=backupPeriodBounds(backupPeriodMode,dailyBackupDay,backupSelectedMonth,backupSelectedYear);
   if(!window.XLSX)throw Error('Excel library is unavailable. Connect to the internet and reload.');
   let workbook=null,base=null,filename='';
   if(kind==='new'){
    filename=String($('backupMasterFileName').value||'').trim();
    if(!/^[^\\/:*?"<>|]+\.xlsx$/i.test(filename)||filename.startsWith('.'))throw Error('Enter a valid .xlsx filename, for example ncestudent.xlsx');
    backupWorkbookFileName=filename;
   }else{
    if(!file)throw Error('Choose your existing NCE Attendance .xlsx file first.');
    if(!/\.xlsx$/i.test(file.name))throw Error('Only .xlsx attendance workbooks are supported.');
    if(file.size>100*1024*1024)throw Error('File is larger than 100 MB. Please use a smaller backup workbook.');
    filename=file.name;
    status.textContent='Reading and checking your existing Excel workbook...';
    workbook=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});
   }
   status.textContent='Step 1/3: Reading Attendance, Student Leave and Absent Calls from Firebase...';
   const byRange=collectionName=>{
    const ref=collection(db,collectionName);
    return p.mode==='daily'?query(ref,where('date','==',p.start)):query(ref,where('date','>=',p.start),where('date','<=',p.end));
   };
   const [studentSnap,attendanceSnap,holidaySnap,staffSnap,callSnap,leaveSnap]=await Promise.all([
    getDocs(collection(db,'students')),getDocs(byRange('attendance')),getDocs(byRange('batchHolidays')),
    getDocs(collection(db,'staffProfiles')),getDocs(byRange('absentCalls')),
    getDocs(query(collection(db,'studentLeavePlans'),where('to','>=',p.start)))
   ]);
   const parse=s=>s.docs.map(x=>({id:x.id,...x.data()}));
   const studentList=parse(studentSnap),staffList=parse(staffSnap),attRows=parse(attendanceSnap),holidayRows=parse(holidaySnap),callRows=parse(callSnap),
    leavePlans=parse(leaveSnap).filter(x=>x.from<=p.end);
   if(!attRows.length&&!callRows.length&&!holidayRows.length)
    if(!confirm('No attendance or absent calls found for '+p.start+' to '+p.end+'. Continue with an empty period?'))return;
   if(attRows.length>50000&&!confirm(attRows.length+' attendance records found. This may use significant memory, Excel processing and Firebase reads. Continue?'))return;
   status.textContent='Step 2/3: Grouping records by exact Student ID, Staff and Batch...';
   await new Promise(resolve=>setTimeout(resolve,0));
   const result=backupBuildPeriod(p,studentList,staffList,attRows,holidayRows,callRows,leavePlans);
   for(const [name,header,rows] of result.sheets)if(rows.length+1>1048576)throw Error(name+' exceeds the Excel row limit. Choose a smaller period.');
   if(kind!=='new')base=backupReadExisting(workbook,firebaseConfig.projectId);
   const oldCount=base?[...base.old.values()].reduce((n,rows)=>n+rows.length,0):0;
   const cleaningOld=!!base?.legacy || !!base?.recovered;
   const recoverCheck=backupRecoveryReport(base,result,p);
   const refreshed=base?[...base.old.values()].reduce((n,rows)=>n+rows.filter(r=>String(r[0])>=p.start&&String(r[0])<=p.end).length,0):0;
   const newCount=result.sheets.reduce((n,x)=>n+x[2].length,0);
   if(kind!=='new'){
    const action=handle?'DIRECTLY OVERWRITE':'DOWNLOAD AN UPDATED COPY OF';
    const recoveryNote=recoverCheck?'\nREPAIR: '+recoverCheck.exact+' exact matching past rows; '+recoverCheck.unmatched+' changed/old rows and '+recoverCheck.ambiguous+' ambiguous rows within the selected period will be retained separately for review. '+recoverCheck.outside+' rows outside the selected period will also be retained.\n':'';
    if(!confirm('UPDATE CONFIRMATION\n\nFile: '+filename+'\nMode: '+p.mode+'\nPeriod: '+p.start+' to '+p.end+'\nPrevious detail rows: '+oldCount+'\nEarlier rows within selected dates: '+refreshed+'\nNew rows from Firebase: '+newCount+'\n'+recoveryNote+'\nAttendance, Student Leave and Absent Call History are retained. Old technical columns and extra report sheets will be removed from the updated COPY, not from Firebase. If this is a recovered workbook, only uniquely identical rows are reconciled; review the separately retained unmatched rows for duplicates. '+action+' this workbook?'))return;
   }
   status.textContent='Step 3/3: Writing only Attendance, Student Leave and Absent Call History sheets...';
   await new Promise(resolve=>setTimeout(resolve,0));
   const stamp=new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour12:false});
   const output=backupMergeWorkbook({baseData:base,period:p,result,nowStamp:stamp,filename});
   if(handle){
    const binary=XLSX.write(output.wb,{type:'array',bookType:'xlsx',compression:true});
    const writable=await handle.createWritable();
    try{await writable.write(new Blob([binary],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));await writable.close()}
    catch(error){try{await writable.abort()}catch(e){}throw error}
    status.textContent='Updated the SAME Excel file: '+filename+' · '+output.totals.days+' dates covered · '+output.totals.recordCount+' attendance, '+output.totals.leaveCount+' leave and '+output.totals.callCount+' call records. Keep a separate backup copy.';
   }else{
    XLSX.writeFile(output.wb,filename,{compression:true});
    status.textContent=(kind==='new'?'Created new':'Updated Excel download requested: ')+filename+' · '+output.totals.days+' dates covered · '+output.totals.recordCount+' attendance, '+output.totals.leaveCount+' leave and '+output.totals.callCount+' call records. If your browser renames it (1), verify and replace your old copy yourself.';
   }
   try{localStorage.setItem('nceExcelBackup:'+firebaseConfig.projectId+':'+p.mode+':'+p.start+':'+p.end,stamp)}catch(e){}
  }catch(err){console.error(err);status.textContent='Excel backup failed: '+(err?.message||String(err));alertError(err)}
  finally{buttons.forEach(b=>b.disabled=false);inputs.forEach(b=>b.disabled=false)}
 }

// Shift records are immutable history: effective dates select the duty schedule for each day.
function shiftForDay(uid,date,shiftRecords){
 const rows=(shiftRecords||[]).filter(x=>x.staffUid===uid&&x.effectiveDate<=date).sort((a,b)=>b.effectiveDate.localeCompare(a.effectiveDate));
 return rows[0]||{startTime:'08:00',endTime:'18:00',graceIn:15,graceOut:15};
}
function shiftMinutes(t){const p=String(t||'').split(':').map(Number);return p.length===2&&p.every(Number.isFinite)?p[0]*60+p[1]:null}
function shiftDeduction(checkIn,checkOut,shift){
 const start=shiftMinutes(shift.startTime),end=shiftMinutes(shift.endTime);
 const duty=(end!==null&&start!==null&&end>start)?end-start:600;
 const inMin=mins(checkIn),outMin=mins(checkOut);
 return {late:inMin===null?0:Math.max(0,inMin-(start+Number(shift.graceIn??15))),early:outMin===null?0:Math.max(0,(end-Number(shift.graceOut??15))-outMin),duty};
}

// Staff attendance is stored separately from student attendance.
// Access is enforced by Firebase Authentication and Firestore Rules, not by hiding a button.
let staffAttendanceDate=today();
function istNow(){return new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata',hour12:false});}
function displayClock(t){return t?esc(t):'—';}
// Shared staff-holiday logic: one officeHolidays document per YYYY-MM-DD.
// Legacy records without holidayType/scope remain PAID and apply to all staff.
function nceHolidayForStaff(date,uid,holidayMap){
 const h=holidayMap instanceof Map?holidayMap.get(date):holidayMap?.[date];
 if(!h)return null;
 if(h.scope==='selected' && !(Array.isArray(h.staffUids)&&h.staffUids.includes(uid)))return null;
 return h;
}
function nceHolidayUnpaid(h){return !!h&&(h.holidayType==='unpaid'||h.paid===false);}
// Priority: weekly off (paid), actual work on holiday, explicit holiday,
// approved unpaid leave, ordinary recorded work, otherwise absence.
// Exactly ONE payable status per staff/date: no double deductions.
function nceStaffDayDecision(date,uid,holidayMap,punch,leave){
 const sunday=new Date(date+'T12:00:00').getDay()===0;
 const holiday=nceHolidayForStaff(date,uid,holidayMap);
 if(sunday)return {kind:'paidOff',label:'Sunday / Weekly Off',holiday,sunday};
 if(holiday&&punch?.checkIn)return {kind:'present',label:'Present (Worked on '+(nceHolidayUnpaid(holiday)?'Unpaid':'Paid')+' Holiday)',holiday,sunday};
 if(holiday)return {kind:nceHolidayUnpaid(holiday)?'unpaidHoliday':'paidOff',label:(nceHolidayUnpaid(holiday)?'Unpaid':'Paid')+' Holiday: '+String(holiday.reason||holiday.name||'Office Holiday'),holiday,sunday};
 if(leave?.status==='approved')return {kind:'leave',label:'Unpaid Leave: '+String(leave.reason||'Not specified'),holiday:null,sunday};
 if(punch?.checkIn)return {kind:'present',label:'Present',holiday:null,sunday};
 return {kind:'absent',label:'Absent',holiday:null,sunday};
}
function nceIsoDates(from,to){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to))throw Error('Select valid From / To dates.');
 const start=new Date(from+'T12:00:00Z'),end=new Date(to+'T12:00:00Z');
 if(!Number.isFinite(start.getTime())||!Number.isFinite(end.getTime())||start.toISOString().slice(0,10)!==from||end.toISOString().slice(0,10)!==to||end<start)throw Error('Holiday To Date must be on or after From Date.');
 const days=Math.round((end-start)/86400000)+1;
 if(days>366)throw Error('Choose 366 days or fewer per holiday range.');
 return Array.from({length:days},(_,i)=>new Date(start.getTime()+i*86400000).toISOString().slice(0,10));
}

// Read-only staff calendar. No salary amounts, no modifications to attendance/leave history.
function nceStaffCalendarDayInfo(date,profile,records){
 const d=new Date(date+'T12:00:00');const punch=records.punch.get(date)||null;
 const breaks=records.breaks.get(date)?.entries||[];
 const leave=records.leaves.get(date)||null;
 const permission=records.permissions.get(date)||null;
 const corrections=records.corrections.get(date)||[];
 const officeHoliday=nceHolidayForStaff(date,profile.id,records.holidays);
 const officeClosing=records.closings.get(date)||null;
 const sunday=d.getDay()===0;
 const joined=profile.joiningDate&&date<profile.joiningDate;
 const future=date>today();
 const decision=nceStaffDayDecision(date,profile.id,records.holidays,punch,leave);
 let key='n',label='Not marked',reason='';
 if(joined){key='f';label='Before joining'}
 else if(decision.kind==='paidOff'){key='h';label=decision.label;reason=officeHoliday?.reason||officeHoliday?.name||''}
 else if(decision.kind==='unpaidHoliday'){key='u';label=decision.label;reason=officeHoliday?.reason||officeHoliday?.name||''}
 else if(decision.kind==='leave'){key='l';label='Approved Unpaid Leave';reason=leave.reason||''}
 else if(decision.kind==='present'){key=punch.checkOut?'p':date===today()?'p':'w';label=punch.checkOut?decision.label:date===today()?'Checked in / On Duty':'Missing Check-out'}
 else if(leave?.status==='pending'){key='w';label='Leave Pending';reason=leave.reason||''}
 else if(future){key='f';label='Upcoming'}
 else if(date===today()){key='n';label='Not marked yet'}
 else{key='a';label='Absent';reason='No approved leave or check-in recorded'}
 const conflict=!!(leave?.status==='approved'&&punch?.checkIn);
 return {date,key,label,reason,punch,breaks,leave,permission,corrections,officeHoliday,officeClosing,sunday,conflict};
}
function nceStaffCalendarDateHtml(info){
 const line=(label,value)=>`<div class="nce-cal-detail-row"><b>${esc(label)}:</b> ${esc(value??'—')}</div>`;
 const status=info.conflict?info.label+' — Attendance also recorded (review)':info.label;
 const rows=[line('Status',status),line('Check-in',info.punch?.checkIn||'—'),line('Check-out',info.punch?.checkOut||'—')];
 if(info.reason)rows.push(line('Status reason',info.reason));
 if(info.leave)rows.push(line('Leave Request',String(info.leave.status||'pending').toUpperCase()+' · '+(info.leave.reason||'No reason recorded')));
 if(info.officeHoliday)rows.push(line('Office Holiday',(nceHolidayUnpaid(info.officeHoliday)?'UNPAID':'PAID')+' · '+(info.officeHoliday.reason||info.officeHoliday.name||'Office holiday')));
 if(info.officeClosing)rows.push(line('Office Early Closing',info.officeClosing.reason||'Approved')); 
 if(info.breaks.length){info.breaks.forEach((b,i)=>rows.push(line('Break '+(i+1),[b.reason||'Unspecified',b.start||'—','to',b.end||'Ongoing'].join(' · '))))}
 else rows.push(line('Breaks','No breaks recorded'));
 if(info.permission)rows.push(line('Sir Permission',String(info.permission.status||'pending')+' · '+(info.permission.reason||'No reason recorded')));
 for(const c of info.corrections)rows.push(line('Correction Request',(c.type||'')+' '+(c.time||'')+' · '+(c.status||'pending')+' · '+(c.reason||'No reason recorded')));
 if(info.key==='a')rows.push(line('Absent reason','No reason recorded; no approved leave or check-in found'));
 return `<h3>${esc(info.date)} · ${esc(status)}</h3>${rows.join('')}`;
}

  ]);

// NCE quick calculator: live Firebase staff IDs, attendance, approved leaves and salary rates.
// Preview changes are local; only 'Save Salary' writes the monthly rate to staffPayroll.
function nceSalaryForStaff(profile,rate,month,data){
 const days=new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate();
 const start=month+'-01',end=month+'-'+String(days).padStart(2,'0');
 const joining=profile.joiningDate||data.pay?.joiningDate||null;
 const reset=data.pay?.resetMonth===month?data.pay.resetFrom:null;
 const startDate=[start,joining,reset].filter(Boolean).sort().at(-1);
 const through=today()<end?today():end;
 const fullMonth=startDate===start&&through===end;
 const eligible=through>=startDate?Math.floor((new Date(through+'T12:00:00')-new Date(startDate+'T12:00:00'))/86400000)+1:0;
 const dayRate=rate/30;
 const base=fullMonth?rate:Math.min(rate,Math.min(30,eligible)*dayRate);
 let present=0,absent=0,leave=0,off=0,unpaidHoliday=0,late=0,early=0,missing=0;
 const details=[];
 for(let i=1;i<=days;i++){
  const date=month+'-'+String(i).padStart(2,'0');if(date<startDate||date>through)continue;
  const rec=data.attendance.get(date),leaveRecord=data.leaves.get(date);
   const statusInfo=nceStaffDayDecision(date,profile.id,data.holidays,rec,leaveRecord);
  let status='',dayLate=0,dayEarly=0;
  if(statusInfo.kind==='paidOff'){off++;status=statusInfo.label;}
   else if(statusInfo.kind==='unpaidHoliday'){unpaidHoliday++;status=statusInfo.label;}
   else if(statusInfo.kind==='leave'){leave++;status=statusInfo.label;}
   else if(statusInfo.kind==='absent'){absent++;status=statusInfo.label;}
  else{
   present++;status=statusInfo.label;const shift=shiftForDay(profile.id,date,data.shifts);
   const calc=statusInfo.holiday?{late:0,early:0}:shiftDeduction(rec.checkIn,rec.checkOut,shift);dayLate=calc.late;
   if(rec.checkOut){if(!data.closings.has(date)&&data.permissions.get(date)?.status!=='approved')dayEarly=calc.early;}
   else {missing++;status='Missing Check-out — Review';}
   late+=dayLate;early+=dayEarly;
  }
  const duty=shiftForDay(profile.id,date,data.shifts);
  details.push({date,status,late:dayLate,early:dayEarly,duty});
 }
 const absentDeduction=(absent+leave+unpaidHoliday)*dayRate;
 const timeDeduction=details.reduce((sum,x)=>sum+(x.late+x.early)*(dayRate/Math.max(1,shiftDeduction(null,null,x.duty).duty)),0);
 return {present,absent,leave,off,unpaidHoliday,late,early,missing,details,base,eligible,fullMonth,absentDeduction,timeDeduction,payable:Math.max(0,base-absentDeduction-timeDeduction),monthClosed:payrollMonthClosed(month),startDate};
}

 document.querySelectorAll('[data-slip]').forEach(b=>b.onclick=()=>{const x0=results.find(y=>y.staff.id===b.dataset.slip);if(!x0)return;const snap=payments.get(x0.staff.id+'_'+payrollMonth)?.monthEndSummary;const x=snap?{...x0,salary:snap.monthlySalary,base:snap.base,worked:snap.present,paidOff:snap.paidOff,absent:snap.unpaidDays,unpaidHolidays:snap.unpaidHolidayDays||0,late:snap.lateMinutes,early:snap.earlyMinutes,absentDeduction:snap.absentDeduction,timeDeduction:snap.timeDeduction,payable:snap.payable,details:snap.dailyBreakdown||x0.details}:x0;const w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print.');w.document.write('<!doctype html><html><head><title>Salary Slip</title><style>body{font:16px Arial;padding:35px;max-width:650px;margin:auto}table{width:100%;border-collapse:collapse}td{padding:10px;border-bottom:1px solid #ddd}@media print{.no-print{display:none!important}}</style></head><body><div class="no-print" style="display:flex;justify-content:flex-end;margin-bottom:16px"><button type="button" onclick="window.close()" style="cursor:pointer;padding:10px 18px;border:1px solid #bfcbd9;border-radius:8px;background:#edf4fc;font-weight:700">× Close</button></div><h1>NCE Institute</h1><h2>'+(snap?'Final Month-End Salary Slip':'Provisional Salary Slip')+'</h2><p>'+esc(x.staff.name)+' · '+esc(payrollMonth)+'</p><table>'+[['Monthly Salary',money(x.salary)],['30-day daily rate',money(x.salary/30)],['Salary calculation starts',x.startDate],['Eligible Days',x.eligible],['Accrued Base Salary',money(x.base)],['Present Days',x.worked],['Paid Sundays / Holidays',x.paidOff],['Unpaid Days',x.absent],['Unpaid Holidays',x.unpaidHolidays||0],['Late Minutes',x.late],['Early Minutes',x.early],['Absent Deduction',money(x.absentDeduction)],['Time Deduction',money(x.timeDeduction)],['Estimated Payable',money(x.payable)]].map(a=>'<tr><td>'+a[0]+'</td><td>'+a[1]+'</td></tr>').join('')+'</table><h3>Date-wise Calculation</h3><table>'+x.details.map(d=>'<tr><td>'+d.date+  document.querySelectorAll('[data-approve],[data-reject]').forEach(b=>b.onclick=async()=>{try{const id=b.dataset.approve||b.dataset.reject;await updateDoc(doc(db,'sirPermissions',id),{status:b.dataset.approve?'approved':'rejected',reviewedBy:user.uid,reviewedAt:serverTimestamp()});await payrollView()}catch(e){alertError(e)}});
 $('approveEarlyClosing').onclick=async()=>{try{const d=$('earlyClosingDate').value,reason=$('earlyClosingReason').value.trim();if(!d||!reason)throw Error('Date and reason are required');if(d>today())throw Error('Cannot approve a future date');if(!confirm('Approve full day for all staff on '+d+'? Early-exit deduction will be waived.'))return;await setDoc(doc(db,'officeEarlyClosings',d),{date:d,reason,approvedBy:user.uid,approvedAt:serverTimestamp()});await addDoc(collection(db,'officeEarlyClosingHistory'),{date:d,reason,action:'approved',adminUid:user.uid,createdAt:serverTimestamp()});await payrollView()}catch(e){alertError(e)}};

 const holidayScopeSelect=$('nceHolidayScope');
 holidayScopeSelect.onchange=()=>{$('nceHolidayStaffWrap').classList.toggle('hidden',holidayScopeSelect.value!=='selected');};
 const nceHint=()=>{try{const dates=nceIsoDates($('nceHolidayFrom').value,$('nceHolidayTo').value);$('nceHolidayHint').textContent=dates.length+' calendar day(s) · '+$('nceHolidayType').value.toUpperCase()+' · '+($('nceHolidayScope').value==='all'?'All Staff':'Selected Staff');}catch(e){$('nceHolidayHint').textContent=e.message;}};
 ['nceHolidayFrom','nceHolidayTo','nceHolidayType','nceHolidayScope'].forEach(id=>$(id).addEventListener('change',nceHint));
 $('nceSaveHolidayRange').onclick=async()=>{
  const btn=$('nceSaveHolidayRange');
  try{
   const from=$('nceHolidayFrom').value,to=$('nceHolidayTo').value,days=nceIsoDates(from,to);
   const reason=$('nceHolidayReason').value.trim(),type=$('nceHolidayType').value,scope=$('nceHolidayScope').value;
   const staffUids=scope==='selected'?[...document.querySelectorAll('[data-nce-holiday-uid]:checked')].map(x=>x.value):[];
   if(!reason||reason.length>250)throw Error('Holiday reason must be between 1 and 250 characters.');
   if(!['paid','unpaid'].includes(type)||!['all','selected'].includes(scope))throw Error('Invalid holiday choice.');
   if(scope==='selected'&&!staffUids.length)throw Error('Select at least one staff member.');
   if(scope==='selected'&&staffUids.some(uid=>!staff.some(x=>x.id===uid&&x.role==='staff')))throw Error('Staff selection is invalid.');
   const existing=holidays.filter(h=>days.includes(h.date));
   const ask='Save '+days.length+' '+type.toUpperCase()+' holiday day(s) from '+from+' to '+to+' for '+(scope==='all'?'ALL STAFF':staffUids.length+' selected staff')+'?\nReason: '+reason+(existing.length?'\nWARNING: '+existing.length+' existing holiday date(s) will be REPLACED.':'')+'\nStudent batch holidays and attendance records are not changed.'+(days.some(date=>date<=today())?'\nWARNING: Editing an already completed date changes payroll previews; any saved month-end salary must be reviewed/recalculated manually.':'');
   if(!confirm(ask))return;
   btn.disabled=true;
   const batch=writeBatch(db);const groupId=from+'_'+to+'_'+Date.now();
   days.forEach(date=>batch.set(doc(db,'officeHolidays',date),{date,name:reason,reason,holidayType:type,paid:type==='paid',scope,staffUids,rangeFrom:from,rangeTo:to,groupId,updatedBy:user.uid,updatedAt:serverTimestamp()}));
   await batch.commit();payrollMonth=from.slice(0,7);alert(days.length+' holiday date(s) saved. Calendar and Salary will now reflect '+type.toUpperCase()+' holidays.');await payrollView();
  }catch(e){alertError(e)}finally{btn.disabled=false}
 };

  const h=holidays.find(x=>x.date===b.dataset.holidayEdit);if(!h)return;
  $('nceHolidayFrom').value=h.date;$('nceHolidayTo').value=h.date;$('nceHolidayReason').value=h.reason||h.name||'';

  const ids=new Set(h.staffUids||[]);document.querySelectorAll('[data-nce-holiday-uid]').forEach(x=>x.checked=ids.has(x.value));
  holidayScopeSelect.onchange();nceHint();$('nceHolidayFrom').scrollIntoView({behavior:'smooth',block:'center'});
 });
 document.querySelectorAll('[data-delholidayrange]').forEach(b=>b.onclick=async()=>{
  const group=b.dataset.delholidayrange,items=holidays.filter(x=>x.groupId===group);
  if(!items.length||items.length>366)return alert('Holiday range not found or too large.');

 });
